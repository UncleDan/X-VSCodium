; ============================================================
; X-VSCodium.ini
; Version: 1.5.4 rev1beta
; ============================================================
;
; STRUTTURA CARTELLE ATTESA:
;   X-VSCodium\
;   ├── X-VSCodium.exe
;   ├── X-VSCodium.ini             (questo file)
;   ├── build.bat
;   ├── Bin\
;   │   └── VSCodium\              ← contenuto dello zip portabile
;   │       ├── VSCodium.exe       ← eseguibile principale
;   │       ├── resources\
;   │       │   └── app\
;   │       │       └── resources\
;   │       │           └── win32\
;   │       │               └── code.ico  ← icona (copiare in icons\)
;   │       ├── locales\
;   │       └── data\              ← CARTELLA PORTABILITÀ (creata dal launcher)
;   │           ├── user-data\     ← settings, keybindings, temi, workspace
;   │           │   └── User\
;   │           │       ├── settings.json
;   │           │       ├── keybindings.json
;   │           │       └── snippets\
;   │           ├── extensions\    ← estensioni installate
;   │           └── tmp\           ← file temporanei
;   └── icons\
;       └── code.ico               ← copiare da Bin\VSCodium\resources\app\resources\win32\
;
; PORTABILITÀ NATIVA:
;   La presenza di Bin\VSCodium\data\ attiva automaticamente la
;   portable mode di VSCodium. Tutta la configurazione e le estensioni
;   vengono scritte in data\ invece di %APPDATA%\VSCodium.
;   Non servono parametri --user-data-dir o --extensions-dir.
;
; AGGIORNAMENTO BINARI:
;   Per aggiornare VSCodium mantenendo settings e estensioni:
;   1. Estrarre la nuova versione in una cartella temporanea
;   2. Copiare il contenuto (esclusa data\) in Bin\VSCodium\
;   3. Avviare X-VSCodium.exe — data\ è già presente e viene usata
; ============================================================

[Launch]

; Percorso eseguibile relativo alla cartella di X-VSCodium.exe
ProgramExecutable=Bin\VSCodium\VSCodium.exe

; Directory di lavoro: deve essere Bin\VSCodium\ per il rilevamento di data\
WorkingDirectory=%ProgramDir%\Bin\VSCodium

; Parametri opzionali — lasciare vuoto per avvio normale
; Esempi utili:
;   --new-window         : forza apertura nuova finestra
;   --disable-extensions : avvia senza estensioni (debug)
;   --log debug          : log verboso per troubleshooting
;   "%ProgramDir%\progetto" : apre una cartella specifica
ProgramParameters=

[UserData]

; VSCodium scrive tutto in Bin\data\ (portable mode nativa).
; Backup/Restore non necessario.

[Environment]

; Nessuna variabile necessaria — la portable mode è attivata
; dalla presenza di Bin\data\ rilevata automaticamente da VSCodium.

[Registry]

; VSCodium non scrive chiavi di registro critiche in portable mode.
; Può scrivere handler per apertura file (opzionale):
;
; BackupKey1=HKCU\Software\Classes\VSCodium
; RestoreKey1=HKCU\Software\Classes\VSCodium

[FileOps]

; Nessuna operazione su file necessaria.
; La pulizia dei file lock è gestita nel .au3 con logica multi-istanza.

[PathNormalize]

; VSCodium scrive percorsi assoluti in diversi file di configurazione.
; Normalizzare garantisce portabilità dopo spostamento del pacchetto.
;
; settings.json: percorsi a interpreter Python, cartelle di lavoro, ecc.
NormalizeFile1=%ProgramDir%\Bin\VSCodium\data\user-data\User\settings.json
;
; workspaceStorage: stato degli workspace aperti (percorsi assoluti)
; NOTA: è una cartella, non un file singolo — X-Launcher normalizza
; tutti i file .json dentro le sottocartelle se supportato.
; NormalizeDir1=%ProgramDir%\Bin\VSCodium\data\user-data\User\workspaceStorage
