; ============================================================
;  X-VSCodium.ini - winPenPack X-Launcher configuration
;  VSCodium - Free/Libre Open Source Software Binaries of VSCode
;  Versione: 1.0 - Compatibile con X-Launcher 1.5.4
;
;  NOTA: il download automatico al primo avvio e la gestione
;  delle variabili d'ambiente sono gestiti da X-VSCodium.au3
;  (compilato in X-VSCodium.exe). Questo file serve a X-Launcher
;  per la gestione dei backup delle impostazioni utente
;  (User\, Temp\) e per i metadati del menu winPenPack.
; ============================================================

[Software]
; Nome del software visualizzato nel menu winPenPack
Name=VSCodium
; Versione - aggiornata automaticamente da X-VSCodium.exe al primo avvio
Version=0.0.0
; Categoria nel menu winPenPack
Category=Development
; Lingua
Language=Multilanguage
; URL homepage
URL=https://vscodium.com/
; Descrizione breve
Description=Free/Libre Open Source Software Binaries of VSCode without MS telemetry

[Launch]
; Percorso dell'eseguibile relativo alla cartella Bin\X-VSCodium\
; NOTA: VSCodium usa "codium.exe", non "Code.exe" come VSCode originale
AppPath=Bin\X-VSCodium\codium.exe
; Argomenti da passare all'eseguibile
AppArgs=
; Directory di lavoro
AppWorkDir=
; Icona nel menu winPenPack
AppIcon=Bin\X-VSCodium\codium.exe,0
; Attendere la chiusura prima della pulizia (necessario per sincronizzare User\)
WaitClose=true
; Stato finestra: Normal, Minimized, Maximized, Hidden
WindowState=Normal

[Paths]
; Cartella utente di backup (relativa alla root winPenPack)
; X-Launcher sincronizza questa cartella con data\user-data prima/dopo il lancio
UserPath=User\X-VSCodium

; Cartella temporanea
TempPath=Temp\X-VSCodium

[PortableMode]
; VSCodium usa nativamente la portable mode tramite la cartella data\
; affiancata a codium.exe. Questa struttura viene creata da X-VSCodium.exe
; durante il primo avvio (setup automatico).
;
;   Bin\X-VSCodium\
;     codium.exe
;     data\
;       user-data\   <- impostazioni, temi, keybindings, snippet
;       extensions\  <- estensioni installate da open-vsx.org
;       tmp\         <- file temporanei

; Sincronizza User -> data\ prima del lancio
SyncUserToBin=true
; Sincronizza data\ -> User dopo la chiusura
SyncBinToUser=true

[Environment]
; Le variabili d'ambiente VSCODE_APPDATA, VSCODE_LOGS, VSCODE_EXTENSIONS
; e DISABLE_TELEMETRY vengono impostate direttamente da X-VSCodium.exe
; prima di avviare codium.exe, quindi non e' necessario duplicarle qui.

[Registry]
; VSCodium in portable mode NON scrive nel registro di sistema.
; Sezione vuota intenzionalmente.

[Splash]
ShowSplash=false
; SplashImage=Bin\X-VSCodium\splash.jpg
; SplashTime=2000

[Update]
; API GitHub per la verifica degli aggiornamenti
UpdateURL=https://api.github.com/repos/VSCodium/vscodium/releases/latest
UpdateField=tag_name

[Info]
Author=VSCodium Community
License=MIT
Website=https://vscodium.com/
SourceCode=https://github.com/VSCodium/vscodium
WinPenPackPage=https://www.winpenpack.com
Notes=VSCodium e' la versione FOSS di VS Code senza telemetria. Al primo avvio X-VSCodium.exe scarica automaticamente l'ultima versione da GitHub e configura la portable mode. Nessuna traccia nel registro di sistema.
